<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- GridCraft app icon, Arthavan Projects house style: a light glyph on a dark tile in the app's own tint.
       Original artwork drawn in code, MIT OR Apache-2.0 like the repository. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#234d31"/>
      <stop offset="1" stop-color="#0a1a0f"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4"/>
  <g fill="none" stroke="#98e1b1" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <rect x="112" y="124" width="288" height="264" rx="28" fill="#397f50" fill-opacity="0.35"/>
    <path d="M112 196 H400" />
    <path d="M112 260 H400 M112 324 H400 M208 124 V388 M304 124 V388" stroke-width="14" stroke-opacity="0.75"/>
    <rect x="208" y="260" width="96" height="64" fill="none" stroke="#c2f4d3" stroke-width="18" stroke-linejoin="miter"/>
  </g>
  </g>
</svg>
