# Release: builds, packages and publishes GridCraft through the shared Arthavan Projects release
# workflow (685ks/craft-actions). Run it from Actions > Release > Run workflow with the version to
# release (normally the [workspace.package] version in Cargo.toml). It creates the GitHub Release
# tagged v<version> on this repository, as a draft unless `publish` is set; the Arthavan Projects
# launcher installs and updates GridCraft from these releases. Packaging metadata (ids, icon,
# categories) is in packaging/app.toml.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.10.0)"
        type: string
        required: true
      publish:
        description: "Publish the release (otherwise it stays a draft)"
        type: boolean
        default: false
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    uses: 685ks/craft-actions/.github/workflows/release-rust-app.yml@main
    with:
      app-id: gridcraft
      display-name: GridCraft
      bundle-id: app.freedev.ainz.ks.GridCraft
      version: ${{ inputs.version }}
      package: gridcraft
      bin: gridcraft
      features: ""
      publish: ${{ inputs.publish }}
      prerelease: ${{ inputs.prerelease }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write
